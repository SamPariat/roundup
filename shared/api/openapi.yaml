openapi: 3.0.3

info:
  title: Roundup API
  version: 1.0.0
  description: |
    The public API of Roundup, as served by the gateway.

    - **Clients only talk to the gateway.** It verifies the access token,
      forwards the request to the owning service (auth, user or venue) and
      returns its response unchanged. An upstream that is down or slow
      answers 502.
    - **Every response is an envelope:** `{"success": true, "data": ...}` or
      `{"success": false, "error": "..."}`. Responses documented as having no
      body (202, 204 and some 201s) have no envelope either.
    - **Request IDs:** the gateway generates a fresh `X-Request-ID` for every
      request (a client-sent one is ignored) and returns it on the response.
      Quote it when reporting a problem.
    - `/api/v1/events`, `/billing`, `/media` and `/realtime` are reserved and
      answer 501 until those services exist.

    This file is checked against every service's router in tests
    (`TestRoutesAreDocumented`), so a new route fails CI until it is added here.

servers:
  - url: http://localhost:8080
    description: Gateway (local)

tags:
  - name: Auth
    description: Phone OTP login and token refresh. Rate limited to 20 requests per 15 minutes per client IP.
  - name: Users
    description: The signed-in user's profile.
  - name: Device tokens
    description: Push notification tokens for the signed-in user.
  - name: Squads
    description: Groups of friends. Any member adds people by phone; admins remove people and change roles.
  - name: Venues
    description: Venue search and details, backed by Google Places.
  - name: Favorites
    description: Venues a user saved for a squad.
  - name: History
    description: Venues a squad has visited.
  - name: Health
    description: Liveness and readiness probes. Every service exposes these.
  - name: Internal
    description: Service-to-service routes. Not reachable through the gateway.

security:
  - bearerAuth: []

paths:
  # ─── Auth ────────────────────────────────────────────────────────────────

  /api/v1/auth/otp/request:
    x-service: auth-service
    post:
      tags: [Auth]
      operationId: requestOTP
      summary: Send a login code by SMS
      description: |
        Sends a 6-digit code to the phone, valid for 5 minutes. At most 3 codes
        per phone per 15 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestOTPRequest'
      responses:
        '202':
          description: Code sent. No body.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/otp/verify:
    x-service: auth-service
    post:
      tags: [Auth]
      operationId: verifyOTP
      summary: Exchange a login code for tokens
      description: |
        Verifies the code and returns an access/refresh token pair. Creates the
        user on first login (`isNewUser: true`). After 5 wrong attempts the code
        is burned and a new one must be requested.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
      responses:
        '200':
          description: Logged in.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCode'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/refresh:
    x-service: auth-service
    post:
      tags: [Auth]
      operationId: refreshTokens
      summary: Rotate the token pair
      description: |
        Returns a new access and refresh token. The old refresh token stops
        working; presenting it again revokes the whole session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New token pair.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidRefreshToken'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/logout:
    x-service: auth-service
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the session
      description: Revokes the session the refresh token belongs to. Logging out twice is not an error.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Logged out. No body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidRefreshToken'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  # ─── Users ───────────────────────────────────────────────────────────────

  /api/v1/users/me:
    x-service: user-service
    get:
      tags: [Users]
      operationId: getMe
      summary: Get my profile
      responses:
        '200':
          $ref: '#/components/responses/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Users]
      operationId: updateMe
      summary: Update my profile
      description: Only the fields present in the body change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          $ref: '#/components/responses/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Users]
      operationId: deleteMe
      summary: Delete my account
      description: Soft-deletes the user and removes all their device tokens.
      responses:
        '204':
          description: Deleted. No body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users/me/device-tokens:
    x-service: user-service
    post:
      tags: [Device tokens]
      operationId: registerDeviceToken
      summary: Register a push token
      description: Idempotent. Registering an existing token updates its platform and keeps the original `createdAt`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceTokenRequest'
      responses:
        '201':
          description: Registered.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/DeviceToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users/me/device-tokens/{token}:
    x-service: user-service
    delete:
      tags: [Device tokens]
      operationId: removeDeviceToken
      summary: Remove a push token
      parameters:
        - name: token
          in: path
          required: true
          description: The token, URL-encoded (FCM tokens contain `:`).
          schema:
            type: string
      responses:
        '204':
          description: Removed. No body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users/lookup:
    x-service: user-service
    post:
      tags: [Users]
      operationId: lookupUsers
      summary: Find which contacts are on Roundup
      description: |
        Send phone numbers from the device's contacts; the response lists the
        ones that belong to Roundup users, so the app can offer to add them to
        a squad. Invalid numbers are skipped, duplicates collapse, and the
        caller is never in the result. Numbers go in the body so they stay out
        of URLs and request logs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupUsersRequest'
      responses:
        '200':
          description: The Roundup users among the numbers, in no particular order.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/LookupUsersResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalError'

  # ─── Squads ──────────────────────────────────────────────────────────────

  /api/v1/squads:
    x-service: user-service
    post:
      tags: [Squads]
      operationId: createSquad
      summary: Create a squad
      description: The caller becomes the squad's first admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSquadRequest'
      responses:
        '201':
          description: Created.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Squad'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Squads]
      operationId: listSquads
      summary: List my squads
      description: Newest first, with my role and the member count.
      responses:
        '200':
          description: My squads.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/SquadsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/squads/{squadID}:
    x-service: user-service
    parameters:
      - $ref: '#/components/parameters/SquadID'
    get:
      tags: [Squads]
      operationId: getSquad
      summary: Get a squad with its members
      description: |
        404 if the squad does not exist or I am not in it; the two look the same.
        Includes my role, which member is me, and `permissions` saying which
        actions I may take, so the app shows only controls that will work.
      responses:
        '200':
          description: The squad, members ordered by when they joined.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/SquadDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Squads]
      operationId: updateSquad
      summary: Rename a squad or change its picture
      description: |
        Needs `permissions.canEditSquad` (admins, under the current policy).
        Omitted fields are left unchanged; an empty `avatarURL` removes the picture.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSquadRequest'
      responses:
        '200':
          description: The updated squad.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Squad'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/squads/{squadID}/members:
    x-service: user-service
    parameters:
      - $ref: '#/components/parameters/SquadID'
    post:
      tags: [Squads]
      operationId: addSquadMember
      summary: Add someone by phone
      description: |
        Any member can add people. The number must belong to a Roundup user
        (see `POST /api/v1/users/lookup`). A squad holds at most 50 members.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          description: Added as a member.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/SquadMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The squad does not exist, I am not in it, or no Roundup user has this number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Already a member, or the squad is full.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/squads/{squadID}/members/{userID}:
    x-service: user-service
    parameters:
      - $ref: '#/components/parameters/SquadID'
      - name: userID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Squads]
      operationId: changeSquadMemberRole
      summary: Make someone admin, or demote them
      description: |
        Needs `permissions.canChangeRoles` (admins, under the current policy).
        A squad can have several admins but always needs one: demoting the
        only admin answers 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRoleRequest'
      responses:
        '204':
          description: Role changed. No body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Squads]
      operationId: removeSquadMember
      summary: Remove a member, or leave
      description: |
        Pass your own user ID to leave; anyone can. Removing someone else is
        admin-only. If the last admin leaves, the member who joined earliest
        becomes admin. If the last member leaves, the squad is deleted.
      responses:
        '204':
          description: Removed. No body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalError'

  # ─── Venues ──────────────────────────────────────────────────────────────

  /api/v1/venues:
    x-service: venue-service
    get:
      tags: [Venues]
      operationId: searchVenues
      summary: Search venues near a point
      description: Results are cached for 10 minutes. No pagination.
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
          example: 19.076
        - name: lng
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
          example: 72.8777
        - name: radius
          in: query
          required: true
          description: Search radius in meters.
          schema:
            type: integer
            minimum: 1
            maximum: 50000
          example: 2000
        - name: query
          in: query
          description: Optional keyword, e.g. "rooftop".
          schema:
            type: string
        - name: type
          in: query
          description: Optional Google place type, e.g. "restaurant".
          schema:
            type: string
      responses:
        '200':
          description: Matching venues.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/venues/{placeID}:
    x-service: venue-service
    get:
      tags: [Venues]
      operationId: getVenue
      summary: Get venue details
      parameters:
        - $ref: '#/components/parameters/PlaceID'
      responses:
        '200':
          description: The venue with phone, website, hours and reviews.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/VenueDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/venues/photos/{ref}:
    x-service: venue-service
    get:
      tags: [Venues]
      operationId: getVenuePhoto
      summary: Get a venue photo
      description: |
        The image bytes, fetched from Google so the API key never reaches the
        client. Public (no token), because image tags cannot send one; rate
        limited per client IP at the gateway. Use the `url` from a venue's
        `photos`; it already points here.
      security: []
      parameters:
        - name: ref
          in: path
          required: true
          description: Opaque photo reference, as in a `photos[].url`.
          schema:
            type: string
        - name: maxWidth
          in: query
          description: Widest the image may be; 800 when omitted, capped at 1600.
          schema:
            type: integer
            minimum: 1
            maximum: 1600
      responses:
        '200':
          description: The photo.
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=86400
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  # ─── Favorites ───────────────────────────────────────────────────────────

  /api/v1/squads/{squadID}/favorites:
    x-service: venue-service
    parameters:
      - $ref: '#/components/parameters/SquadID'
    get:
      tags: [Favorites]
      operationId: listFavorites
      summary: List my saved venues for a squad
      description: Newest first.
      responses:
        '200':
          description: Saved venues.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/FavoritesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SquadNotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Favorites]
      operationId: addFavorite
      summary: Save a venue for a squad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddFavoriteRequest'
      responses:
        '201':
          description: Saved. No body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/SquadNotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/squads/{squadID}/favorites/{placeID}:
    x-service: venue-service
    parameters:
      - $ref: '#/components/parameters/SquadID'
      - $ref: '#/components/parameters/PlaceID'
    delete:
      tags: [Favorites]
      operationId: removeFavorite
      summary: Unsave a venue
      responses:
        '204':
          description: Removed. No body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/squads/{squadID}/favorites/{placeID}/check:
    x-service: venue-service
    parameters:
      - $ref: '#/components/parameters/SquadID'
      - $ref: '#/components/parameters/PlaceID'
    get:
      tags: [Favorites]
      operationId: isFavorite
      summary: Check whether I saved a venue
      responses:
        '200':
          description: Whether the venue is saved.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/IsFavoriteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SquadNotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  # ─── History ─────────────────────────────────────────────────────────────

  /api/v1/squads/{squadID}/history:
    x-service: venue-service
    parameters:
      - $ref: '#/components/parameters/SquadID'
    get:
      tags: [History]
      operationId: getVisitHistory
      summary: List venues the squad visited
      description: One entry per venue, with how often and when last it was visited.
      responses:
        '200':
          description: Visit summary per venue.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/VisitHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SquadNotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [History]
      operationId: recordVisit
      summary: Record a visit
      description: A visit is unique per squad, event and venue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordVisitRequest'
      responses:
        '201':
          description: Recorded. No body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/SquadNotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  # ─── Internal ────────────────────────────────────────────────────────────

  /api/v1/users:
    x-service: user-service
    servers:
      - url: http://localhost:3002
        description: user-service (direct; the gateway answers 404)
    post:
      tags: [Internal]
      operationId: createOrGetUser
      summary: Create or fetch a user by phone
      description: |
        Called by auth-service after a code is verified. Returns the existing
        user if the phone is already registered. Blocked at the gateway.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          $ref: '#/components/responses/User'
        '200':
          $ref: '#/components/responses/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  # ─── Health ──────────────────────────────────────────────────────────────

  /health:
    x-service: all
    get:
      tags: [Health]
      operationId: health
      summary: Liveness
      description: Always 200 while the process is up. Never checks dependencies.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Status'

  /ready:
    x-service: all
    get:
      tags: [Health]
      operationId: ready
      summary: Readiness
      description: 200 once every dependency (e.g. Postgres) answers within 2 seconds.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Status'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The `accessToken` from `/auth/otp/verify` or `/auth/refresh`: an
        EdDSA-signed JWT valid for 15 minutes. The gateway verifies it and
        forwards the user ID to the service as `X-User-ID`.

  headers:
    X-Request-ID:
      description: Generated by the gateway for every request; appears in every service's logs.
      schema:
        type: string
        format: uuid

  parameters:
    SquadID:
      name: squadID
      in: path
      required: true
      schema:
        type: string
    PlaceID:
      name: placeID
      in: path
      required: true
      description: Google Places ID.
      schema:
        type: string
      example: ChIJN1t_tDeuEmsRUsoyG83frY4

  responses:
    User:
      description: The user.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
    Status:
      description: The service is up.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        enum: [ok, ready]
    BadRequest:
      description: The body, a query parameter or a path parameter is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: phone must be in E.164 format, e.g. +919876543210
    Unauthorized:
      description: The bearer token is missing, invalid or expired.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: invalid or expired access token
    SquadNotFound:
      description: The squad does not exist or the caller is not a member.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: 'squad not found: 7dc92d84-1950-43d6-b676-debacf84d830'
    Forbidden:
      description: |
        My role in the squad may not take this action. The rules are in
        user-service's permission policy (services/user-service/docs/PERMISSIONS.md);
        the matching `permissions` flag on the squad is false.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: 'you are not allowed to do this in this squad: squad:edit'
    InvalidCode:
      description: The code is wrong, expired, already used or was never requested.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: invalid or expired code
    InvalidRefreshToken:
      description: The refresh token is unknown, expired or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: invalid refresh token
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: user not found
    Conflict:
      description: The resource already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: 'venue already saved: ChIJN1t_tDeuEmsRUsoyG83frY4'
    TooManyRequests:
      description: Rate limited, either per client IP at the gateway or per phone at auth-service.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: too many code requests, try again later
    BadGateway:
      description: The gateway could not reach the upstream service in time.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: A dependency (another service, Google Places, Postgres) is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: place provider unavailable
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # ─── Envelope ──────────────────────────────────────────────────────────

    SuccessEnvelope:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          enum: [true]
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: string

    # ─── Auth ──────────────────────────────────────────────────────────────

    Phone:
      type: string
      description: E.164 phone number.
      pattern: '^\+[1-9]\d{7,14}$'
      example: '+919876543210'
    RequestOTPRequest:
      type: object
      required: [phone]
      properties:
        phone:
          $ref: '#/components/schemas/Phone'
    VerifyOTPRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          $ref: '#/components/schemas/Phone'
        code:
          type: string
          pattern: '^\d{6}$'
          example: '123456'
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    TokenPair:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt]
      properties:
        accessToken:
          type: string
          description: 'Send as `Authorization: Bearer <accessToken>`.'
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: Opaque; rotates on every refresh.
        refreshTokenExpiresAt:
          type: string
          format: date-time
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [userID, isNewUser]
          properties:
            userID:
              type: string
              format: uuid
            isNewUser:
              type: boolean
              description: True on the first login; the app should ask for a name.

    # ─── Users ─────────────────────────────────────────────────────────────

    CreateUserRequest:
      type: object
      required: [phone]
      properties:
        phone:
          $ref: '#/components/schemas/Phone'
    User:
      type: object
      required: [id, phone, name, avatarURL, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        phone:
          $ref: '#/components/schemas/Phone'
        name:
          type: string
          description: Empty until the user sets one.
        avatarURL:
          type: string
          description: Empty when unset.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UpdateProfileRequest:
      type: object
      description: Omitted fields are left unchanged.
      properties:
        name:
          type: string
          description: Trimmed; must not be blank.
          example: Sam
        avatarURL:
          type: string
          description: An empty string clears it.
    RegisterDeviceTokenRequest:
      type: object
      required: [token, platform]
      properties:
        token:
          type: string
          description: FCM or APNs token. Must not be blank.
        platform:
          $ref: '#/components/schemas/Platform'
    Platform:
      type: string
      enum: [iOS, Android]
    DeviceToken:
      type: object
      required: [id, token, platform, createdAt]
      properties:
        id:
          type: integer
          format: int64
        token:
          type: string
        platform:
          $ref: '#/components/schemas/Platform'
        createdAt:
          type: string
          format: date-time

    LookupUsersRequest:
      type: object
      required: [phones]
      properties:
        phones:
          type: array
          maxItems: 500
          items:
            type: string
          example: ['+919876543210', '+14155550123']
    UserSummary:
      type: object
      required: [id, phone, name, avatarURL]
      properties:
        id:
          type: string
          format: uuid
        phone:
          $ref: '#/components/schemas/Phone'
        name:
          type: string
        avatarURL:
          type: string
    LookupUsersResponse:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'

    # ─── Squads ────────────────────────────────────────────────────────────

    Role:
      type: string
      enum: [ADMIN, MEMBER]
    CreateSquadRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Trimmed; must not be blank.
          example: Friday crew
        avatarURL:
          type: string
    UpdateSquadRequest:
      type: object
      properties:
        name:
          type: string
          description: Trimmed; must not be blank.
          example: Saturday crew
        avatarURL:
          type: string
          description: Empty removes the picture.
    AddMemberRequest:
      type: object
      required: [phone]
      properties:
        phone:
          $ref: '#/components/schemas/Phone'
    ChangeRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/Role'
    Squad:
      type: object
      required: [id, name, avatarURL, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        avatarURL:
          type: string
          description: Empty when unset.
        createdBy:
          type: string
          format: uuid
          description: The creator, who may since have left.
        createdAt:
          type: string
          format: date-time
    SquadSummary:
      allOf:
        - $ref: '#/components/schemas/Squad'
        - type: object
          required: [role, memberCount, memberPreview]
          properties:
            role:
              $ref: '#/components/schemas/Role'
            memberCount:
              type: integer
            memberPreview:
              type: array
              maxItems: 4
              description: The first members to join, for the avatar row.
              items:
                $ref: '#/components/schemas/SquadMember'
    SquadsResponse:
      type: object
      required: [squads]
      properties:
        squads:
          type: array
          items:
            $ref: '#/components/schemas/SquadSummary'
    SquadMember:
      type: object
      required: [userID, name, avatarURL, role, joinedAt]
      properties:
        userID:
          type: string
          format: uuid
        name:
          type: string
        avatarURL:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        joinedAt:
          type: string
          format: date-time
    SquadDetail:
      allOf:
        - $ref: '#/components/schemas/Squad'
        - type: object
          required: [myRole, memberCount, createdByName, members, permissions]
          properties:
            myRole:
              $ref: '#/components/schemas/Role'
            memberCount:
              type: integer
            createdByName:
              type: string
              nullable: true
              description: Null if the creator has left; empty if they have not set a name.
            members:
              type: array
              maxItems: 50
              items:
                allOf:
                  - $ref: '#/components/schemas/SquadMember'
                  - type: object
                    required: [isMe]
                    properties:
                      isMe:
                        type: boolean
            permissions:
              $ref: '#/components/schemas/SquadPermissions'
    SquadPermissions:
      type: object
      description: What I may do in this squad, computed from the same permission policy the server enforces.
      required: [canAddMembers, canRemoveMembers, canChangeRoles, canEditSquad]
      properties:
        canAddMembers:
          type: boolean
          description: Any member may add people while the squad has room.
        canRemoveMembers:
          type: boolean
          description: Remove someone other than myself. Leaving is always allowed.
        canChangeRoles:
          type: boolean
        canEditSquad:
          type: boolean
          description: Rename the squad or change its picture.

    # ─── Venues ────────────────────────────────────────────────────────────

    Photo:
      type: object
      required: [url, width, height]
      properties:
        url:
          type: string
          description: Path on this API that serves the image without a token.
          example: /api/v1/venues/photos/AWU5eFj...
        width:
          type: integer
          description: Original width in pixels.
        height:
          type: integer
          description: Original height in pixels.
    Review:
      type: object
      required: [authorName, rating, text, publishedAt]
      properties:
        authorName:
          type: string
        rating:
          type: number
          format: float
        text:
          type: string
        publishedAt:
          type: string
          format: date-time
    Venue:
      type: object
      required: [placeID, name, address, latitude, longitude, averageRating, ratingCount, priceLevel, types, isOpen, photos]
      properties:
        placeID:
          type: string
        name:
          type: string
        address:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        averageRating:
          type: number
          format: float
          description: 1–5, or 0 when unrated.
        ratingCount:
          type: integer
          description: How many ratings averageRating is based on.
        priceLevel:
          type: integer
          minimum: 0
          maximum: 4
        types:
          type: array
          items:
            type: string
        isOpen:
          type: boolean
          nullable: true
          description: Null when Google does not know.
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
    VenueDetail:
      allOf:
        - $ref: '#/components/schemas/Venue'
        - type: object
          required: [phoneNumber, website, openingHours, reviews, editorialSummary]
          properties:
            phoneNumber:
              type: string
            website:
              type: string
            openingHours:
              type: array
              items:
                type: string
              example: ['Monday: 12:00 – 11:00 PM']
            reviews:
              type: array
              maxItems: 5
              items:
                $ref: '#/components/schemas/Review'
            editorialSummary:
              type: string
    SearchResponse:
      type: object
      required: [venues]
      properties:
        venues:
          type: array
          items:
            $ref: '#/components/schemas/Venue'

    # ─── Favorites ─────────────────────────────────────────────────────────

    AddFavoriteRequest:
      type: object
      required: [placeID, name]
      properties:
        placeID:
          type: string
        name:
          type: string
    SavedVenue:
      type: object
      required: [id, placeID, name, userID, savedAt]
      properties:
        id:
          type: integer
          format: int64
        placeID:
          type: string
        name:
          type: string
        userID:
          type: string
          format: uuid
        savedAt:
          type: string
          format: date-time
    FavoritesResponse:
      type: object
      required: [favorites]
      properties:
        favorites:
          type: array
          items:
            $ref: '#/components/schemas/SavedVenue'
    IsFavoriteResponse:
      type: object
      required: [isFavorite]
      properties:
        isFavorite:
          type: boolean

    # ─── History ───────────────────────────────────────────────────────────

    RecordVisitRequest:
      type: object
      required: [eventID, placeID, name, visitedAt]
      properties:
        eventID:
          type: string
        placeID:
          type: string
        name:
          type: string
        visitedAt:
          type: string
          format: date-time
        avgSpendInPaise:
          type: integer
          format: int64
          description: Average spend per person in paise. 0 or omitted means unknown.
    VisitSummary:
      type: object
      required: [placeID, name, visitCount, lastVisitedAt]
      properties:
        placeID:
          type: string
        name:
          type: string
        visitCount:
          type: integer
          format: int64
        lastVisitedAt:
          type: string
          format: date-time
    VisitHistoryResponse:
      type: object
      required: [history]
      properties:
        history:
          type: array
          items:
            $ref: '#/components/schemas/VisitSummary'
