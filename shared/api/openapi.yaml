      operationId: health
      summary: Liveness
      description: Always 200 while the process is up. Never checks dependencies.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Status'

  /ready:
    x-service: all
    get:
      tags: [Health]
      operationId: ready
      summary: Readiness
      description: 200 once every dependency (e.g. Postgres) answers within 2 seconds.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Status'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The `accessToken` from `/auth/otp/verify` or `/auth/refresh`: an
        EdDSA-signed JWT valid for 15 minutes. The gateway verifies it and
        forwards the user ID to the service as `X-User-ID`.

  headers:
    X-Request-ID:
      description: Generated by the gateway for every request; appears in every service's logs.
      schema:
        type: string
        format: uuid

  parameters:
    Limit:
      name: limit
      in: query
      description: Page size. 400 outside 1–100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      description: |
        The `nextCursor` of the previous page; omit for the first page. Opaque:
        send it back exactly as received. A cursor this API did not issue is a 400.
      schema:
        type: string
    SquadID:
      name: squadID
      in: path
      required: true
      schema:
        type: string
    EventID:
      name: eventID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlaceID:
      name: placeID
      in: path
      required: true
      description: Google Places ID.
      schema:
        type: string
      example: ChIJN1t_tDeuEmsRUsoyG83frY4

  responses:
    User:
      description: The user.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
    Status:
      description: The service is up.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        enum: [ok, ready]
    BadRequest:
      description: The body, a query parameter or a path parameter is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: phone must be in E.164 format, e.g. +919876543210
    Unauthorized:
      description: The bearer token is missing, invalid or expired.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: invalid or expired access token
    SquadNotFound:
      description: The squad does not exist or the caller is not a member.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: 'squad not found: 7dc92d84-1950-43d6-b676-debacf84d830'
    Forbidden:
      description: |
        My role in the squad may not take this action. The rules are in
        user-service's permission policy (services/user-service/docs/PERMISSIONS.md);
        the matching `permissions` flag on the squad is false.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: 'you are not allowed to do this in this squad: squad:edit'
    InvalidCode:
      description: The code is wrong, expired, already used or was never requested.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: invalid or expired code
    InvalidRefreshToken:
      description: The refresh token is unknown, expired or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: invalid refresh token
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: user not found
    EventNotFound:
      description: The event does not exist, or the caller is not in its squad.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: 'event not found: 6f1c…'
    EventConflict:
      description: The event's status doesn't allow this now, or the place was already suggested.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: 'not allowed while the event is in this state: DRAFT → ACTIVE'
    Conflict:
      description: The resource already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: 'venue already saved: ChIJN1t_tDeuEmsRUsoyG83frY4'
    TooManyRequests:
      description: Rate limited, either per client IP at the gateway or per phone at auth-service.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: too many code requests, try again later
    BadGateway:
      description: The gateway could not reach the upstream service in time.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: A dependency (another service, Google Places, Postgres) is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: place provider unavailable
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # ─── Envelope ──────────────────────────────────────────────────────────

    SuccessEnvelope:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          enum: [true]
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: string

    # ─── Auth ──────────────────────────────────────────────────────────────

    Phone:
      type: string
      description: E.164 phone number.
      pattern: '^\+[1-9]\d{7,14}$'
      example: '+919876543210'
    RequestOTPRequest:
      type: object
      required: [phone]
      properties:
        phone:
          $ref: '#/components/schemas/Phone'
    VerifyOTPRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          $ref: '#/components/schemas/Phone'
        code:
          type: string
          pattern: '^\d{6}$'
          example: '123456'
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    TokenPair:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt]
      properties:
        accessToken:
          type: string
          description: 'Send as `Authorization: Bearer <accessToken>`.'
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: Opaque; rotates on every refresh.
        refreshTokenExpiresAt:
          type: string
          format: date-time
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [userID, isNewUser]
          properties:
            userID:
              type: string
              format: uuid
            isNewUser:
              type: boolean
              description: True on the first login; the app should ask for a name.

    # ─── Users ─────────────────────────────────────────────────────────────

    CreateUserRequest:
      type: object
      required: [phone]
      properties:
        phone:
          $ref: '#/components/schemas/Phone'
    User:
      type: object
      required: [id, phone, name, avatarURL, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        phone:
          $ref: '#/components/schemas/Phone'
        name:
          type: string
          description: Empty until the user sets one.
        avatarURL:
          type: string
          description: Empty when unset.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UpdateProfileRequest:
      type: object
      description: Omitted fields are left unchanged.
      properties:
        name:
          type: string
          description: Trimmed; must not be blank.
          example: Sam
        avatarURL:
          type: string
          description: An empty string clears it.
    RegisterDeviceTokenRequest:
      type: object
      required: [token, platform]
      properties:
        token:
          type: string
          description: FCM or APNs token. Must not be blank.
        platform:
          $ref: '#/components/schemas/Platform'
    Platform:
      type: string
      enum: [iOS, Android]
    DeviceToken:
      type: object
      required: [id, token, platform, createdAt]
      properties:
        id:
          type: integer
          format: int64
        token:
          type: string
        platform:
          $ref: '#/components/schemas/Platform'
        createdAt:
          type: string
          format: date-time

    LookupUsersRequest:
      type: object
      required: [phones]
      properties:
        phones:
          type: array
          maxItems: 500
          items:
            type: string
          example: ['+919876543210', '+14155550123']
    UserSummary:
      type: object
      required: [id, phone, name, avatarURL]
      properties:
        id:
          type: string
          format: uuid
        phone:
          $ref: '#/components/schemas/Phone'
        name:
          type: string
        avatarURL:
          type: string
    LookupUsersResponse:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'

    # ─── Squads ────────────────────────────────────────────────────────────

    Role:
      type: string
      enum: [ADMIN, MEMBER]
    CreateSquadRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Trimmed; must not be blank.
          example: Friday crew
        avatarURL:
          type: string
    UpdateSquadRequest:
      type: object
      properties:
        name:
          type: string
          description: Trimmed; must not be blank.
          example: Saturday crew
        avatarURL:
          type: string
          description: Empty removes the picture.
    AddMemberRequest:
      type: object
      required: [phone]
      properties:
        phone:
          $ref: '#/components/schemas/Phone'
    ChangeRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/Role'
    Squad:
      type: object
      required: [id, name, avatarURL, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        avatarURL:
          type: string
          description: Empty when unset.
        createdBy:
          type: string
          format: uuid
          description: The creator, who may since have left.
        createdAt:
          type: string
          format: date-time
    SquadSummary:
      allOf:
        - $ref: '#/components/schemas/Squad'
        - type: object
          required: [role, memberCount, memberPreview]
          properties:
            role:
              $ref: '#/components/schemas/Role'
            memberCount:
              type: integer
            memberPreview:
              type: array
              maxItems: 4
              description: The first members to join, for the avatar row.
              items:
                $ref: '#/components/schemas/SquadMember'
    SquadsResponse:
      type: object
      required: [squads, nextCursor]
      properties:
        squads:
          type: array
          items:
            $ref: '#/components/schemas/SquadSummary'
        nextCursor:
          type: string
          nullable: true
          description: Pass as `cursor` for the next page; null on the last page.
    SquadMember:
      type: object
      required: [userID, name, avatarURL, role, joinedAt]
      properties:
        userID:
          type: string
          format: uuid
        name:
          type: string
        avatarURL:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        joinedAt:
          type: string
          format: date-time
    SquadDetail:
      allOf:
        - $ref: '#/components/schemas/Squad'
        - type: object
          required: [myRole, memberCount, createdByName, members, permissions]
          properties:
            myRole:
              $ref: '#/components/schemas/Role'
            memberCount:
              type: integer
            createdByName:
              type: string
              nullable: true
              description: Null if the creator has left; empty if they have not set a name.
            members:
              type: array
              maxItems: 50
              items:
                allOf:
                  - $ref: '#/components/schemas/SquadMember'
                  - type: object
                    required: [isMe]
                    properties:
                      isMe:
                        type: boolean
            permissions:
              $ref: '#/components/schemas/SquadPermissions'
    SquadPermissions:
      type: object
      description: What I may do in this squad, computed from the same permission policy the server enforces.
      required: [canAddMembers, canRemoveMembers, canChangeRoles, canEditSquad]
      properties:
        canAddMembers:
          type: boolean
          description: Any member may add people while the squad has room.
        canRemoveMembers:
          type: boolean
          description: Remove someone other than myself. Leaving is always allowed.
        canChangeRoles:
          type: boolean
        canEditSquad:
          type: boolean
          description: Rename the squad or change its picture.

    # ─── Venues ────────────────────────────────────────────────────────────

    Photo:
      type: object
      required: [url, width, height]
      properties:
        url:
          type: string
          description: Path on this API that serves the image without a token.
          example: /api/v1/venues/photos/AWU5eFj...
        width:
          type: integer
          description: Original width in pixels.
        height:
          type: integer
          description: Original height in pixels.
    Review:
      type: object
      required: [authorName, rating, text, publishedAt]
      properties:
        authorName:
          type: string
        rating:
          type: number
          format: float
        text:
          type: string
        publishedAt:
          type: string
          format: date-time
    Venue:
      type: object
      required: [placeID, name, address, latitude, longitude, averageRating, ratingCount, priceLevel, types, isOpen, photos]
      properties:
        placeID:
          type: string
        name:
          type: string
        address:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        averageRating:
          type: number
          format: float
          description: 1–5, or 0 when unrated.
        ratingCount:
          type: integer
          description: How many ratings averageRating is based on.
        priceLevel:
          type: integer
          minimum: 0
          maximum: 4
        types:
          type: array
          items:
            type: string
        isOpen:
          type: boolean
          nullable: true
          description: Null when Google does not know.
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
    VenueDetail:
      allOf:
        - $ref: '#/components/schemas/Venue'
        - type: object
          required: [phoneNumber, website, openingHours, reviews, editorialSummary, savedIn]
          properties:
            phoneNumber:
              type: string
            website:
              type: string
            openingHours:
              type: array
              items:
                type: string
              example: ['Monday: 12:00 – 11:00 PM']
            reviews:
              type: array
              maxItems: 5
              items:
                $ref: '#/components/schemas/Review'
            editorialSummary:
              type: string
            savedIn:
              type: array
              description: One entry per squad the caller is in.
              items:
                $ref: '#/components/schemas/SavedIn'
    SavedIn:
      type: object
      required: [squadID, squadName, saved]
      properties:
        squadID:
          type: string
          format: uuid
        squadName:
          type: string
        saved:
          type: boolean
          description: Whether the caller saved this venue in the squad.
    SearchResponse:
      type: object
      required: [venues, nextCursor]
      properties:
        venues:
          type: array
          items:
            $ref: '#/components/schemas/Venue'
        nextCursor:
          type: string
          nullable: true
          description: Pass as `cursor` for the next page; null on the last page.

    # ─── Favorites ─────────────────────────────────────────────────────────

    AddFavoriteRequest:
      type: object
      required: [placeID]
      properties:
        placeID:
          type: string
    Member:
      type: object
      required: [userID, name, avatarURL]
      properties:
        userID:
          type: string
          format: uuid
        name:
          type: string
          description: Empty until the member completes profile setup.
        avatarURL:
          type: string
    Favorite:
      type: object
      required: [placeID, name, address, averageRating, ratingCount, priceLevel, photo, savedBy, savedByMe, lastSavedAt]
      properties:
        placeID:
          type: string
        name:
          type: string
        address:
          type: string
        averageRating:
          type: number
          format: float
          description: 1–5, or 0 when unrated.
        ratingCount:
          type: integer
        priceLevel:
          type: integer
          minimum: 0
          maximum: 4
        photo:
          allOf:
            - $ref: '#/components/schemas/Photo'
          nullable: true
          description: Null when the venue has no photo.
        savedBy:
          type: array
          description: Current members who saved it, most recent first.
          items:
            $ref: '#/components/schemas/Member'
        savedByMe:
          type: boolean
        lastSavedAt:
          type: string
          format: date-time
    FavoritesResponse:
      type: object
      required: [favorites, nextCursor]
      properties:
        favorites:
          type: array
          items:
            $ref: '#/components/schemas/Favorite'
        nextCursor:
          type: string
          nullable: true
          description: Pass as `cursor` for the next page; null on the last page.

    # ─── History ───────────────────────────────────────────────────────────

    RecordVisitRequest:
      type: object
      required: [eventID, placeID, visitedAt]
      properties:
        eventID:
          type: string
        placeID:
          type: string
        visitedAt:
          type: string
          format: date-time
        avgSpendInPaise:
          type: integer
          format: int64
          description: Average spend per person in paise. 0 or omitted means unknown.
    VisitSummary:
      type: object
      required: [placeID, name, address, photo, visitCount, lastVisitedAt, avgSpendInPaise]
      properties:
        placeID:
          type: string
        name:
          type: string
          description: As of the latest visit.
        address:
          type: string
        photo:
          allOf:
            - $ref: '#/components/schemas/Photo'
          nullable: true
          description: Null when the venue has no photo.
        visitCount:
          type: integer
          format: int64
        lastVisitedAt:
          type: string
          format: date-time
        avgSpendInPaise:
          type: integer
          format: int64
          nullable: true
          description: Average spend per person across visits with a known spend; null when none.
    VisitHistoryResponse:
      type: object
      required: [history, nextCursor]
      properties:
        history:
          type: array
          items:
            $ref: '#/components/schemas/VisitSummary'
        nextCursor:
          type: string
          nullable: true
          description: Pass as `cursor` for the next page; null on the last page.

    # ─── Events ────────────────────────────────────────────────────────────
    EventType:
      type: string
      enum: [DRINKS, DINING, BOTH]
    EventStatus:
      type: string
      enum: [DRAFT, VOTING, CONFIRMED, ACTIVE, CLOSED]
    RSVPStatus:
      type: string
      enum: [GOING, MAYBE, NOT_GOING]
    CreateEventRequest:
      type: object
      required: [name, type, startsAt]
      properties:
        name:
          type: string
          example: Friday drinks
        type:
          $ref: '#/components/schemas/EventType'
        startsAt:
          type: string
          format: date-time
        votingDeadline:
          type: string
          format: date-time
          description: Optional. Defaults to startsAt, so voting stays open until the event starts.
    UpdateEventRequest:
      type: object
      description: Omitted fields are left unchanged.
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/EventType'
        startsAt:
          type: string
          format: date-time
        votingDeadline:
          type: string
          format: date-time
    RSVPRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/RSVPStatus'
    PlaceRequest:
      type: object
      required: [placeID]
      properties:
        placeID:
          type: string
    EventPlace:
      type: object
      description: A suggested place's details, copied from venue-service when suggested.
      properties:
        placeID:
          type: string
        name:
          type: string
        address:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        rating:
          type: number
        priceLevel:
          type: integer
        photo:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Photo'
    Winner:
      allOf:
        - $ref: '#/components/schemas/EventPlace'
        - type: object
          properties:
            votes:
              type: integer
              description: Votes it won with. Only on the event detail.
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
        squadID:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/EventType'
        status:
          $ref: '#/components/schemas/EventStatus'
        createdBy:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
        votingDeadline:
          type: string
          format: date-time
        winner:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Winner'
        closedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    RSVPCounts:
      type: object
      properties:
        going:
          type: integer
        maybe:
          type: integer
        notGoing:
          type: integer
        pending:
          type: integer
          description: Members who haven't answered.
    EventSummary:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          properties:
            rsvpCounts:
              $ref: '#/components/schemas/RSVPCounts'
            goingPreview:
              type: array
              maxItems: 5
              items:
                $ref: '#/components/schemas/Member'
            nominationCount:
              type: integer
            myRsvp:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/RSVPStatus'
            hasVoted:
              type: boolean
    SquadEventsResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventSummary'
        nextCursor:
          type: string
          nullable: true
        openCount:
          type: integer
    EventMember:
      allOf:
        - $ref: '#/components/schemas/Member'
        - type: object
          properties:
            rsvp:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/RSVPStatus'
            isMe:
              type: boolean
    Nomination:
      allOf:
        - $ref: '#/components/schemas/EventPlace'
        - type: object
          properties:
            nominatedBy:
              type: string
              format: uuid
            nominatedByName:
              type: string
              nullable: true
              description: Null if they left the squad.
            nominatedAt:
              type: string
              format: date-time
            voteCount:
              type: integer
            voters:
              type: array
              items:
                $ref: '#/components/schemas/Member'
            votedByMe:
              type: boolean
            canRemove:
              type: boolean
    EventPermissions:
      type: object
      description: Which actions the caller may take right now.
      properties:
        canEdit:
          type: boolean
        canRsvp:
          type: boolean
        canNominate:
          type: boolean
        canVote:
          type: boolean
        canStartVoting:
          type: boolean
        canCloseVoting:
          type: boolean
        canStart:
          type: boolean
        canClose:
          type: boolean
    EventDetail:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          properties:
            createdByName:
              type: string
              nullable: true
            memberCount:
              type: integer
            votedCount:
              type: integer
              description: Current members who voted.
            totalVotes:
              type: integer
            myRsvp:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/RSVPStatus'
            myVote:
              type: string
              nullable: true
            members:
              type: array
              items:
                $ref: '#/components/schemas/EventMember'
            nominations:
              type: array
              items:
                $ref: '#/components/schemas/Nomination'
            permissions:
              $ref: '#/components/schemas/EventPermissions'
    DueResponse:
      type: object
      properties:
        count:
          type: integer
