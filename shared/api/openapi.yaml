    post:
      tags: [Internal]
      operationId: closeDueEvents
      summary: Close nights that started 12 hours ago
      description: 'Called by scheduler-service every minute. Closes CONFIRMED and ACTIVE events and records their visits as the creator. Idempotent and safe to run concurrently.'
      security: []
      responses:
        '200':
          description: How many events moved on.
          headers:
