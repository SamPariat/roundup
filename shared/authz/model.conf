# Casbin model shared by every service's permission check. See each
# service's docs/PERMISSIONS.md for how to read it and for its rules.

[request_definition]
r = role, act

[policy_definition]
p = role, act

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = r.role == p.role && r.act == p.act
